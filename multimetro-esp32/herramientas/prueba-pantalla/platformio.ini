; Firmware de diagnostico: LED, busqueda I2C y prueba de la pantalla 0.42"
[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2@2.36.5

; Igual, pero con la tabla de particiones del multimetro (huge_app)
[env:particion_grande]
extends = env:esp32c3
board_build.partitions = huge_app.csv
