; Multimetro ESP32-C3 (OLED 0.42" integrada) + ADS1115
; Compilar:  pio run          Subir:  pio run -t upload
[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit ADS1X15@2.5.0
    olikraus/U8g2@2.36.5
    h2zero/NimBLE-Arduino@1.4.3

; Prueba sin WiFi ni Bluetooth (diagnostico de reinicios por voltaje bajo)
[env:sin_radio]
extends = env:esp32c3
build_flags =
    ${env:esp32c3.build_flags}
    -DSIN_RADIO
